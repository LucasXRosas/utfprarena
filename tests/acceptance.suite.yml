actor: AcceptanceTester
modules:
  enabled:
    - WebDriver:
        url: "http://web:8080" # porta de testes: php_test (APP_ENV=testing, banco arena_test)
        browser: chrome
        host: selenium # This refers to the Selenium hub in Docker
        port: 4444 # Default port for Selenium Hub
        window_size: 1920x1080
        capabilities:
          chromeOptions:
            args: ["--headless", "--no-sandbox", "--disable-dev-shm-usage", "--window-size=1920,1080"]
    - \Tests\Support\Helper\LoginHelper
