services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: utfprarena_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-utfprarena}
      DB_USERNAME: ${DB_USERNAME:-utfpr}
      DB_PASSWORD: ${DB_PASSWORD:-arena_secret}
    networks:
      - arena_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: utfprarena_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - arena_network
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: utfprarena_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-utfprarena}
      POSTGRES_USER: ${DB_USERNAME:-utfpr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arena_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arena_network

networks:
  arena_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
